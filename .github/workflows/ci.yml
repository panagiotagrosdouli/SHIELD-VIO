name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -e '.[dev]'
      - run: ruff check shield_vio scripts tests
      - run: pytest -q
      - name: Generate deterministic synthetic benchmark
        run: |
          python scripts/run_synthetic_demo.py \
            --out results/synthetic_demo \
            --seed 7
          python scripts/build_synthetic_benchmark_report.py \
            results/synthetic_demo \
            --output results/benchmark-gate/candidate.json
      - name: Run end-to-end benchmark regression gate
        run: |
          python scripts/check_benchmark_regression.py \
            tests/fixtures/benchmarks/synthetic_baseline.json \
            results/benchmark-gate/candidate.json \
            --max-relative-increase 0.05 \
            --max-absolute-increase 0.01 \
            --output results/benchmark-gate/regression-result.json
      - name: Upload benchmark gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shield-vio-benchmark-gate
          path: |
            results/benchmark-gate/*.json
            results/synthetic_demo/summary.json
            results/synthetic_demo/estimated_trajectory.csv
            results/synthetic_demo/ground_truth.csv
          if-no-files-found: error
          retention-days: 14
      - name: Generate synthetic README evidence
        run: |
          python scripts/generate_readme_evidence.py \
            --results results/synthetic_demo \
            --output results/readme_evidence
      - name: Upload reproducible evidence panels
        uses: actions/upload-artifact@v4
        with:
          name: shield-vio-readme-evidence
          path: |
            results/readme_evidence/*.png
            results/synthetic_demo/*.csv
          if-no-files-found: error
          retention-days: 14
