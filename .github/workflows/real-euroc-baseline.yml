name: Real EuRoC Baseline

on:
  workflow_dispatch:
  push:
    branches:
      - agent/real-euroc-baseline
    paths:
      - scripts/run_real_euroc_baseline.py
      - scripts/resolve_euroc_download.py
      - .github/workflows/real-euroc-baseline.yml

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Restore EuRoC MH_01_easy archive
        uses: actions/cache@v4
        with:
          path: data/euroc/MH_01_easy.zip
          key: euroc-mh01-asl-md5-5076cd8923429f1c51c72ae172e14aea
      - name: Download EuRoC MH_01_easy
        run: |
          set -euo pipefail
          mkdir -p data/euroc
          archive=data/euroc/MH_01_easy.zip
          expected_md5=5076cd8923429f1c51c72ae172e14aea
          if [[ -f "$archive" ]] && \
             [[ "$(md5sum "$archive" | cut -d ' ' -f 1)" != "$expected_md5" ]]; then
            rm "$archive"
          fi
          if [[ ! -f "$archive" ]]; then
            euroc_url="$(python scripts/resolve_euroc_download.py)"
            curl \
              --fail \
              --location \
              --proto '=https' \
              --retry 5 \
              --retry-all-errors \
              --retry-delay 5 \
              --connect-timeout 30 \
              --max-time 1200 \
              --output "${archive}.part" \
              "$euroc_url"
            actual_md5="$(md5sum "${archive}.part" | cut -d ' ' -f 1)"
            echo "Downloaded archive MD5: $actual_md5"
            echo "Downloaded archive SHA-256: $(sha256sum "${archive}.part" | cut -d ' ' -f 1)"
            [[ "$actual_md5" == "$expected_md5" ]]
            unzip -tq "${archive}.part"
            mv "${archive}.part" "$archive"
          fi
          archive_entries="$(unzip -Z1 "$archive")"
          for required in \
            mav0/imu0/data.csv \
            mav0/cam0/data.csv \
            mav0/cam1/data.csv \
            mav0/state_groundtruth_estimate0/data.csv; do
            grep -Fqx "$required" <<< "$archive_entries"
          done
          unzip -q "$archive" -d data/euroc/MH_01_easy
      - name: Run real-data baseline
        run: |
          python scripts/run_real_euroc_baseline.py \
            data/euroc/MH_01_easy \
            --output results/real_euroc/MH_01_easy
      - name: Upload complete benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: euroc-mh01-real-baseline
          path: results/real_euroc/MH_01_easy
      - name: Commit compact real metrics
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          mkdir -p results/real_benchmarks/MH_01_easy
          cp results/real_euroc/MH_01_easy/real_baseline_summary.json \
             results/real_benchmarks/MH_01_easy/imu_baseline.json
          git add results/real_benchmarks/MH_01_easy/imu_baseline.json
          git diff --cached --quiet || git commit -m 'Record real EuRoC MH_01 baseline metrics'
          git push
