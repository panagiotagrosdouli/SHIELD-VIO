name: Real EuRoC paired benchmark

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'shield_vio/**'
      - 'scripts/run_euroc.py'
      - 'scripts/resolve_euroc_download.py'
      - 'scripts/run_paper_vertical_slice.py'
      - 'configs/paper/vertical_slice_smoke.yaml'
      - '.github/workflows/real-euroc-paired.yml'
  push:
    branches: [main]
    paths:
      - 'shield_vio/**'
      - 'scripts/run_euroc.py'
      - 'scripts/resolve_euroc_download.py'
      - 'scripts/compare_real_euroc_runs.py'
      - '.github/workflows/real-euroc-paired.yml'

jobs:
  mh01-paired:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Restore EuRoC MH_01_easy archive
        uses: actions/cache@v4
        with:
          path: data/euroc/MH_01_easy.zip
          key: euroc-mh01-asl-md5-5076cd8923429f1c51c72ae172e14aea
      - name: Download EuRoC MH_01_easy ASL sequence
        run: |
          set -euo pipefail
          mkdir -p data/euroc
          archive=data/euroc/MH_01_easy.zip
          expected_md5=5076cd8923429f1c51c72ae172e14aea
          if [[ -f "$archive" ]] && \
             [[ "$(md5sum "$archive" | cut -d ' ' -f 1)" != "$expected_md5" ]]; then
            rm "$archive"
          fi
          if [[ ! -f "$archive" ]]; then
            euroc_url="$(python scripts/resolve_euroc_download.py)"
            curl \
              --fail \
              --location \
              --proto '=https' \
              --retry 5 \
              --retry-all-errors \
              --retry-delay 5 \
              --connect-timeout 30 \
              --max-time 1200 \
              --output "${archive}.part" \
              "$euroc_url"
            actual_md5="$(md5sum "${archive}.part" | cut -d ' ' -f 1)"
            echo "Downloaded archive MD5: $actual_md5"
            echo "Downloaded archive SHA-256: $(sha256sum "${archive}.part" | cut -d ' ' -f 1)"
            [[ "$actual_md5" == "$expected_md5" ]]
            unzip -tq "${archive}.part"
            mv "${archive}.part" "$archive"
          fi
          archive_entries="$(unzip -Z1 "$archive")"
          for required in \
            mav0/imu0/data.csv \
            mav0/cam0/data.csv \
            mav0/cam1/data.csv \
            mav0/state_groundtruth_estimate0/data.csv; do
            grep -Fqx "$required" <<< "$archive_entries"
          done
          unzip -q "$archive" -d data/euroc/MH_01_easy
      - name: Run real IMU-only baseline
        run: |
          python scripts/run_euroc.py data/euroc/MH_01_easy \
            --output results/real_euroc/MH_01_easy/imu_only
      - name: Run real OpenCV rotation configuration
        run: |
          python scripts/run_euroc.py data/euroc/MH_01_easy \
            --output results/real_euroc/MH_01_easy/opencv_rotation \
            --opencv-rotation
      - name: Build paired comparison
        run: |
          python scripts/compare_real_euroc_runs.py \
            results/real_euroc/MH_01_easy/imu_only \
            results/real_euroc/MH_01_easy/opencv_rotation \
            --output results/real_euroc/MH_01_easy/comparison.json
      - name: Run public-data failure-prediction vertical slice
        run: |
          python scripts/run_paper_vertical_slice.py \
            --run-dir results/real_euroc/MH_01_easy/opencv_rotation \
            --sequence-root data/euroc/MH_01_easy \
            --output results/real_euroc/MH_01_easy/paper_vertical_slice \
            --config configs/paper/vertical_slice_smoke.yaml \
            --seed 7
      - name: Upload real benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shield-vio-real-euroc-mh01-paired
          path: results/real_euroc/MH_01_easy
          if-no-files-found: error
          retention-days: 30
