name: Real EuRoC paired benchmark

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'shield_vio/**'
      - 'scripts/run_euroc.py'
      - 'scripts/run_paper_vertical_slice.py'
      - 'scripts/validate_public_smoke.py'
      - 'tests/test_validate_public_smoke.py'
      - 'configs/paper/vertical_slice_smoke.yaml'
      - '.github/workflows/real-euroc-paired.yml'
  push:
    branches: [main]
    paths:
      - 'shield_vio/**'
      - 'scripts/run_euroc.py'
      - 'scripts/compare_real_euroc_runs.py'
      - 'scripts/validate_public_smoke.py'
      - '.github/workflows/real-euroc-paired.yml'

jobs:
  mh01-paired:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Download EuRoC MH_01_easy ASL sequence
        env:
          EUROC_HTTPS_URL: https://robotics.ethz.ch/~asl-datasets/ijrr_euroc_mav_dataset/machine_hall/MH_01_easy/MH_01_easy.zip
          EUROC_HTTP_URL: http://robotics.ethz.ch/~asl-datasets/ijrr_euroc_mav_dataset/machine_hall/MH_01_easy/MH_01_easy.zip
        run: |
          set -euo pipefail
          mkdir -p data/euroc results/real_euroc/MH_01_easy
          archive=data/euroc/MH_01_easy.zip
          source_url="$EUROC_HTTPS_URL"
          if ! curl \
            --fail \
            --location \
            --proto '=https' \
            --retry 2 \
            --retry-all-errors \
            --retry-delay 3 \
            --connect-timeout 15 \
            --max-time 300 \
            --output "$archive" \
            "$EUROC_HTTPS_URL"; then
            echo "HTTPS download failed; retrying the same official ETH archive over HTTP."
            rm -f "$archive"
            source_url="$EUROC_HTTP_URL"
            curl \
              --fail \
              --location \
              --proto '=http' \
              --retry 4 \
              --retry-all-errors \
              --retry-delay 5 \
              --connect-timeout 20 \
              --max-time 600 \
              --output "$archive" \
              "$EUROC_HTTP_URL"
          fi
          unzip -tq "$archive"
          archive_sha256="$(sha256sum "$archive" | awk '{print $1}')"
          archive_bytes="$(stat -c '%s' "$archive")"
          SOURCE_URL="$source_url" ARCHIVE_SHA256="$archive_sha256" ARCHIVE_BYTES="$archive_bytes" \
            python - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = {
              "schema_version": 1,
              "dataset": "EuRoC_MAV",
              "sequence": "MH_01_easy",
              "archive_name": "MH_01_easy.zip",
              "source_url": os.environ["SOURCE_URL"],
              "archive_sha256": os.environ["ARCHIVE_SHA256"],
              "archive_bytes": int(os.environ["ARCHIVE_BYTES"]),
              "source_policy": "official_eth_https_then_official_eth_http_fallback",
              "claim_boundary": (
                  "Download receipt for PUBLIC_DATASET_SMOKE. The exact archive checksum "
                  "must be frozen before confirmatory dataset evaluation."
              ),
          }
          Path("results/real_euroc/MH_01_easy/dataset_download_receipt.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY
          unzip -q "$archive" -d data/euroc/MH_01_easy
      - name: Run real IMU-only baseline
        run: |
          python scripts/run_euroc.py data/euroc/MH_01_easy \
            --output results/real_euroc/MH_01_easy/imu_only
      - name: Run real OpenCV rotation configuration
        run: |
          python scripts/run_euroc.py data/euroc/MH_01_easy \
            --output results/real_euroc/MH_01_easy/opencv_rotation \
            --opencv-rotation
      - name: Build paired comparison
        run: |
          python scripts/compare_real_euroc_runs.py \
            results/real_euroc/MH_01_easy/imu_only \
            results/real_euroc/MH_01_easy/opencv_rotation \
            --output results/real_euroc/MH_01_easy/comparison.json
      - name: Run public-data failure-prediction vertical slice
        run: |
          python scripts/run_paper_vertical_slice.py \
            --run-dir results/real_euroc/MH_01_easy/opencv_rotation \
            --sequence-root data/euroc/MH_01_easy \
            --output results/real_euroc/MH_01_easy/paper_vertical_slice \
            --config configs/paper/vertical_slice_smoke.yaml \
            --seed 7
      - name: Validate publication smoke evidence gate
        run: |
          python scripts/validate_public_smoke.py \
            results/real_euroc/MH_01_easy/paper_vertical_slice \
            --expected-dataset EuRoC_MAV \
            --expected-sequence MH_01_easy \
            --report results/real_euroc/MH_01_easy/paper_vertical_slice/smoke_validation.json
          cat results/real_euroc/MH_01_easy/paper_vertical_slice/smoke_validation.json
      - name: Upload real benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shield-vio-real-euroc-mh01-paired
          path: results/real_euroc/MH_01_easy
          if-no-files-found: error
          retention-days: 30
