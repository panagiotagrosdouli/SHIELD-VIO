name: Real EuRoC paired benchmark

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'shield_vio/**'
      - 'scripts/run_euroc.py'
      - 'scripts/run_paper_vertical_slice.py'
      - 'scripts/validate_public_smoke.py'
      - 'scripts/audit_real_euroc_accuracy.py'
      - 'scripts/audit_euroc_orientation.py'
      - 'scripts/audit_euroc_imu_frames.py'
      - 'scripts/oracle_attitude_initialization_diagnostic.py'
      - 'tests/test_oracle_attitude_initialization_diagnostic.py'
      - 'tests/test_audit_euroc_imu_frames.py'
      - 'tests/test_audit_euroc_orientation.py'
      - 'scripts/convert_euroc_rosbag.py'
      - 'scripts/export_primary_observables.py'
      - 'scripts/export_primary_failure_targets.py'
      - 'scripts/build_public_v2_canonical.py'
      - 'tests/test_validate_public_smoke.py'
      - 'tests/test_real_euroc_accuracy_audit.py'
      - 'tests/test_primary_observables.py'
      - 'tests/test_convert_euroc_rosbag.py'
      - 'pyproject.toml'
      - 'configs/paper/vertical_slice_smoke.yaml'
      - 'configs/paper/failure_primary_v2.yaml'
      - '.github/workflows/real-euroc-paired.yml'
  push:
    branches: [main]
    paths:
      - 'shield_vio/**'
      - 'scripts/run_euroc.py'
      - 'scripts/compare_real_euroc_runs.py'
      - 'scripts/audit_real_euroc_accuracy.py'
      - 'scripts/audit_euroc_orientation.py'
      - 'scripts/audit_euroc_imu_frames.py'
      - 'scripts/oracle_attitude_initialization_diagnostic.py'
      - 'tests/test_oracle_attitude_initialization_diagnostic.py'
      - 'tests/test_audit_euroc_imu_frames.py'
      - 'tests/test_audit_euroc_orientation.py'
      - 'scripts/validate_public_smoke.py'
      - 'scripts/convert_euroc_rosbag.py'
      - 'scripts/export_primary_observables.py'
      - 'scripts/export_primary_failure_targets.py'
      - 'scripts/build_public_v2_canonical.py'
      - 'pyproject.toml'
      - '.github/workflows/real-euroc-paired.yml'

jobs:
  mh01-paired:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev,dataset]'

      - name: Restore portable EuRoC bag cache
        uses: actions/cache@v4
        with:
          path: data/euroc/MH_01_easy.bag
          key: euroc-mh01-rosbag-57f440ccd68ec8dc8f9461269f5909656b86198bac3adfd677b1fcc7a1428fa9

      - name: Acquire EuRoC MH_01_easy
        env:
          EUROC_HTTPS_URL: https://robotics.ethz.ch/~asl-datasets/ijrr_euroc_mav_dataset/machine_hall/MH_01_easy/MH_01_easy.zip
          EUROC_HTTP_URL: http://robotics.ethz.ch/~asl-datasets/ijrr_euroc_mav_dataset/machine_hall/MH_01_easy/MH_01_easy.zip
          EUROC_BAG_MIRROR_URL: https://huggingface.co/datasets/kavehsgh/EuRoC_MAV_Dataset_Machine_Hall_Easy_01/resolve/main/MH_01_easy.bag?download=true
          EUROC_BAG_SHA256: 57f440ccd68ec8dc8f9461269f5909656b86198bac3adfd677b1fcc7a1428fa9
          OPENVINS_REVISION: 69488123ed9362dd44b6f28e7f4680abbff1442b
        run: |
          set -euo pipefail
          mkdir -p data/euroc results/real_euroc/MH_01_easy
          archive=data/euroc/MH_01_easy.zip
          sequence_root=data/euroc/MH_01_easy
          acquisition_mode=""
          source_url=""

          if curl \
            --fail --location --proto '=https' \
            --retry 2 --retry-all-errors --retry-delay 3 \
            --connect-timeout 15 --max-time 300 \
            --output "$archive" "$EUROC_HTTPS_URL"; then
            acquisition_mode="official_eth_legacy_https_zip"
            source_url="$EUROC_HTTPS_URL"
          else
            echo "Legacy ETH HTTPS endpoint unavailable; trying legacy HTTP."
            rm -f "$archive"
            if curl \
              --fail --location --proto '=http' \
              --retry 2 --retry-all-errors --retry-delay 3 \
              --connect-timeout 15 --max-time 300 \
              --output "$archive" "$EUROC_HTTP_URL"; then
              acquisition_mode="official_eth_legacy_http_zip"
              source_url="$EUROC_HTTP_URL"
            fi
          fi

          if [[ -n "$acquisition_mode" ]]; then
            unzip -tq "$archive"
            archive_sha256="$(sha256sum "$archive" | awk '{print $1}')"
            archive_bytes="$(stat -c '%s' "$archive")"
            rm -rf "$sequence_root"
            unzip -q "$archive" -d "$sequence_root"
            SOURCE_URL="$source_url" ARCHIVE_SHA256="$archive_sha256" ARCHIVE_BYTES="$archive_bytes" \
              ACQUISITION_MODE="$acquisition_mode" python - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = {
              "schema_version": 2,
              "dataset": "EuRoC_MAV",
              "sequence": "MH_01_easy",
              "source_url": os.environ["SOURCE_URL"],
              "source_sha256": os.environ["ARCHIVE_SHA256"],
              "source_bytes": int(os.environ["ARCHIVE_BYTES"]),
              "acquisition_mode": os.environ["ACQUISITION_MODE"],
              "confirmatory_identity": False,
              "claim_boundary": (
                  "PUBLIC_DATASET_SMOKE acquisition. The current ETH Research Collection "
                  "identity/checksum must be frozen separately before confirmatory evaluation."
              ),
          }
          Path("results/real_euroc/MH_01_easy/dataset_download_receipt.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY
          else
            echo "Legacy ETH endpoints unavailable; using checksum-verified portable smoke mirror."
            rm -f "$archive"
            bag=data/euroc/MH_01_easy.bag
            if [[ ! -f "$bag" ]]; then
              curl \
                --fail --location \
                --retry 5 --retry-all-errors --retry-delay 5 \
                --connect-timeout 30 --max-time 2400 \
                --output "$bag" "$EUROC_BAG_MIRROR_URL"
            fi
            echo "$EUROC_BAG_SHA256  $bag" | sha256sum --check --strict

            openvins_dir=data/euroc/openvins-pinned
            mkdir -p "$openvins_dir"
            openvins_base="https://raw.githubusercontent.com/rpng/open_vins/$OPENVINS_REVISION"
            curl --fail --location --retry 4 \
              --output "$openvins_dir/MH_01_easy.txt" \
              "$openvins_base/ov_data/euroc_mav/MH_01_easy.txt"
            curl --fail --location --retry 4 \
              --output "$openvins_dir/kalibr_imucam_chain.yaml" \
              "$openvins_base/config/euroc_mav/kalibr_imucam_chain.yaml"
            curl --fail --location --retry 4 \
              --output "$openvins_dir/kalibr_imu_chain.yaml" \
              "$openvins_base/config/euroc_mav/kalibr_imu_chain.yaml"

            rm -rf "$sequence_root"
            python scripts/convert_euroc_rosbag.py "$bag" \
              --output "$sequence_root" \
              --sequence MH_01_easy \
              --expected-bag-sha256 "$EUROC_BAG_SHA256" \
              --source-url "$EUROC_BAG_MIRROR_URL" \
              --openvins-ground-truth "$openvins_dir/MH_01_easy.txt" \
              --openvins-imucam-calibration "$openvins_dir/kalibr_imucam_chain.yaml" \
              --openvins-imu-calibration "$openvins_dir/kalibr_imu_chain.yaml" \
              --openvins-revision "$OPENVINS_REVISION"

            cp "$sequence_root/portable_acquisition_manifest.json" \
              results/real_euroc/MH_01_easy/portable_acquisition_manifest.json
            python - <<'PY'
          import json
          from pathlib import Path

          portable = json.loads(
              Path("results/real_euroc/MH_01_easy/portable_acquisition_manifest.json")
              .read_text(encoding="utf-8")
          )
          receipt = {
              "schema_version": 2,
              "dataset": "EuRoC_MAV",
              "sequence": "MH_01_easy",
              "source_url": portable["source"]["bag_url"],
              "source_sha256": portable["source"]["bag_sha256"],
              "source_bytes": portable["source"]["bag_bytes"],
              "acquisition_mode": "checksum_verified_rosbag_mirror_plus_pinned_openvins",
              "confirmatory_identity": False,
              "claim_boundary": portable["claim_boundary"],
          }
          Path("results/real_euroc/MH_01_easy/dataset_download_receipt.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY
          fi

      - name: Audit raw IMU and ground-truth frame conventions
        run: |
          python scripts/audit_euroc_imu_frames.py \
            --imu data/euroc/MH_01_easy/mav0/imu0/data.csv \
            --groundtruth data/euroc/MH_01_easy/mav0/state_groundtruth_estimate0/data.csv \
            --output results/real_euroc/MH_01_easy/imu_frame_consistency.json
          cat results/real_euroc/MH_01_easy/imu_frame_consistency.json

      - name: Run real IMU-only baseline
        run: |
          python scripts/run_euroc.py data/euroc/MH_01_easy \
            --output results/real_euroc/MH_01_easy/imu_only

      - name: Compare identity and oracle attitude initialization (diagnostic only)
        run: |
          python scripts/oracle_attitude_initialization_diagnostic.py \
            --sequence-root data/euroc/MH_01_easy \
            --output results/real_euroc/MH_01_easy/oracle_attitude_initialization.json
          cat results/real_euroc/MH_01_easy/oracle_attitude_initialization.json

      - name: Run real OpenCV rotation configuration
        run: |
          python scripts/run_euroc.py data/euroc/MH_01_easy \
            --output results/real_euroc/MH_01_easy/opencv_rotation \
            --opencv-rotation

      - name: Sweep gyro-bias prior covariance on real EuRoC
        run: |
          python - <<'PY'
          import csv
          import json
          import subprocess
          import sys
          from pathlib import Path
          import numpy as np

          root = Path("results/real_euroc/MH_01_easy")
          priors = [0.05, 0.1, 0.2]
          baseline = json.loads((root / "opencv_rotation" / "metrics.json").read_text())
          results = []
          for std in priors:
              output = root / "gyro_bias_prior_sweep" / f"std_{std:g}"
              cmd = [
                  sys.executable,
                  "scripts/run_euroc.py",
                  "data/euroc/MH_01_easy",
                  "--output", str(output),
                  "--opencv-rotation",
                  "--initial-gyro-bias-std-rps", str(std),
              ]
              completed = subprocess.run(cmd, capture_output=True, text=True)
              item = {
                  "initial_gyro_bias_std_rps": std,
                  "initial_gyro_bias_covariance_rps2": std**2,
                  "ground_truth_used_for_initialization": False,
              }
              if completed.returncode == 0:
                  metrics = json.loads((output / "metrics.json").read_text())
                  with (output / "trajectory.csv").open(newline="") as stream:
                      trajectory = list(csv.DictReader(stream))
                  bias = np.asarray([[float(row[key]) for key in ("bgx", "bgy", "bgz")] for row in trajectory])
                  item.update({
                      "ate_rmse_m": metrics["ate_rmse_m"],
                      "rpe_translation_rmse_m": metrics["rpe_translation_rmse_m"],
                      "associated_samples": metrics["associated_samples"],
                      "final_gyro_bias_rps": bias[-1].tolist(),
                      "median_gyro_bias_rps": np.median(bias, axis=0).tolist(),
                      "median_gyro_bias_norm_rps": float(np.median(np.linalg.norm(bias, axis=1))),
                  })
              else:
                  item["error"] = completed.stderr[-4000:] or completed.stdout[-4000:]
              results.append(item)
              print(json.dumps(item, sort_keys=True))
          report = {
              "schema_version": 1,
              "sequence": "MH_01_easy",
              "visual_provider": "opencv_rotation",
              "baseline_default_prior": {
                  "ate_rmse_m": baseline["ate_rmse_m"],
                  "rpe_translation_rmse_m": baseline["rpe_translation_rmse_m"],
                  "associated_samples": baseline["associated_samples"],
              },
              "sweep": results,
              "ground_truth_used_for_initialization": False,
              "claim_boundary": (
                  "Non-confirmatory development sensitivity diagnostic. Ground truth is used "
                  "only for post-hoc metrics; varying the initial gyro-bias covariance does "
                  "not establish an optimal prior or resolve estimator failure."
              ),
          }
          destination = root / "gyro_bias_prior_sweep.json"
          destination.write_text(json.dumps(report, indent=2, sort_keys=True) + "\n")
          print(destination.read_text())
          if any("error" in item for item in results):
              raise SystemExit("one or more gyro-bias prior sweep runs failed")
          PY

      - name: Sweep stationary-IMU gravity initialization windows on real EuRoC
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path

          root = Path("results/real_euroc/MH_01_easy")
          baseline = json.loads((root / "imu_only" / "metrics.json").read_text())
          windows = [10, 20, 50, 100, 200, 400]
          results = []
          for window in windows:
              output = root / "gravity_window_sweep" / f"window_{window}"
              cmd = [
                  sys.executable,
                  "scripts/run_euroc.py",
                  "data/euroc/MH_01_easy",
                  "--output", str(output),
                  "--gravity-align-window", str(window),
              ]
              completed = subprocess.run(cmd, capture_output=True, text=True)
              item = {
                  "window_samples": window,
                  "window_duration_s_at_200_hz": window / 200.0,
                  "ground_truth_used_for_initialization": False,
              }
              if completed.returncode == 0:
                  aligned = json.loads((output / "metrics.json").read_text())
                  item.update({
                      "status": "measured",
                      "gravity_aligned_ate_rmse_m": aligned["ate_rmse_m"],
                      "ate_relative_change": aligned["ate_rmse_m"] / baseline["ate_rmse_m"] - 1.0,
                  })
              elif "IMU initialization window is not sufficiently stationary" in completed.stderr:
                  item.update({
                      "status": "rejected_nonstationary",
                      "gravity_aligned_ate_rmse_m": None,
                      "reason": "Window failed the frozen stationarity checks; no aligned result was produced.",
                  })
              else:
                  raise SystemExit(
                      f"Unexpected gravity-alignment failure at N={window}:\n" + completed.stderr
                  )
              results.append(item)
          report = {
              "dataset": "EuRoC MH_01_easy",
              "initialization": "stationary IMU roll/pitch only",
              "baseline_ate_rmse_m": baseline["ate_rmse_m"],
              "confirmatory": False,
              "ground_truth_used_for_initialization": False,
              "yaw_observable": False,
              "windows": results,
              "claim_boundary": "Development-only window sweep; accepted windows do not establish estimator accuracy.",
          }
          (root / "gravity_alignment_experiment.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          print(json.dumps(report, indent=2, sort_keys=True))
          PY

      - name: Audit primary failure observables
        run: |
          python scripts/export_primary_observables.py \
            --run-dir results/real_euroc/MH_01_easy/opencv_rotation \
            --sequence-root data/euroc/MH_01_easy \
            --output results/real_euroc/MH_01_easy/primary_observables
          cat results/real_euroc/MH_01_easy/primary_observables/primary_observable_audit.json

      - name: Export primary V2 failure events and targets
        run: |
          python scripts/export_primary_failure_targets.py \
            --run-dir results/real_euroc/MH_01_easy/opencv_rotation \
            --sequence-root data/euroc/MH_01_easy \
            --output results/real_euroc/MH_01_easy/primary_failure_targets \
            --failure-config configs/paper/failure_primary_v2.yaml \
            --evidence-level PUBLIC_DATASET_SMOKE
          cat results/real_euroc/MH_01_easy/primary_failure_targets/primary_failure_manifest.json

      - name: Build canonical V2 train artifact
        run: |
          python scripts/build_public_v2_canonical.py \
            --run-dir results/real_euroc/MH_01_easy/opencv_rotation \
            --sequence-root data/euroc/MH_01_easy \
            --output results/real_euroc/MH_01_easy/canonical_v2 \
            --dataset euroc \
            --sequence MH_01_easy \
            --estimator internal_eskf \
            --split train \
            --split-config configs/paper/public_dataset_splits.yaml \
            --failure-config configs/paper/failure_primary_v2.yaml
          cat results/real_euroc/MH_01_easy/canonical_v2/canonical_manifest.json

      - name: Build paired comparison
        run: |
          python scripts/compare_real_euroc_runs.py \
            results/real_euroc/MH_01_easy/imu_only \
            results/real_euroc/MH_01_easy/opencv_rotation \
            --output results/real_euroc/MH_01_easy/comparison.json

      - name: Independently evaluate real trajectories with upstream evo
        run: |
          python -m pip install 'evo>=1.28,<2'
          python - <<'PY'
          import csv
          from pathlib import Path

          root = Path("results/real_euroc/MH_01_easy")
          gt = Path("data/euroc/MH_01_easy/mav0/state_groundtruth_estimate0/data.csv")
          output = root / "upstream_evo"
          output.mkdir(parents=True, exist_ok=True)

          def stamp(raw):
              return f"{int(raw) * 1e-9:.9f}"

          with gt.open(newline="", encoding="utf-8") as stream, (output / "groundtruth.tum").open("w", encoding="utf-8") as dest:
              for values in csv.reader(stream):
                  if not values or values[0].lstrip().startswith("#"):
                      continue
                  if len(values) < 8:
                      raise ValueError("EuRoC ground truth has fewer than eight columns")
                  ts, px, py, pz, qw, qx, qy, qz = values[:8]
                  dest.write(f"{stamp(ts)} {px} {py} {pz} {qx} {qy} {qz} {qw}\n")

          for run in ("imu_only", "opencv_rotation"):
              with (root / run / "trajectory.csv").open(newline="", encoding="utf-8") as stream, (output / f"{run}.tum").open("w", encoding="utf-8") as dest:
                  for row in csv.DictReader(stream):
                      dest.write(
                          f"{stamp(row['frame_timestamp_ns'])} "
                          f"{row['px']} {row['py']} {row['pz']} "
                          f"{row['qx']} {row['qy']} {row['qz']} {row['qw']}\n"
                      )
          PY
          for estimator in imu_only opencv_rotation; do
            evo_ape tum \
              results/real_euroc/MH_01_easy/upstream_evo/groundtruth.tum \
              "results/real_euroc/MH_01_easy/upstream_evo/${estimator}.tum" \
              --align --t_max_diff 0.02 \
              --save_results "results/real_euroc/MH_01_easy/upstream_evo/${estimator}_ape.zip"
            unzip -tq "results/real_euroc/MH_01_easy/upstream_evo/${estimator}_ape.zip"
          done

      - name: Audit real estimator drift versus ground-truth motion
        run: |
          python scripts/audit_real_euroc_accuracy.py \
            --groundtruth data/euroc/MH_01_easy/mav0/state_groundtruth_estimate0/data.csv \
            --baseline-metrics results/real_euroc/MH_01_easy/imu_only/metrics.json \
            --visual-metrics results/real_euroc/MH_01_easy/opencv_rotation/metrics.json \
            --output results/real_euroc/MH_01_easy/accuracy_audit.json

      - name: Audit position-aligned attitude error
        run: |
          python scripts/audit_euroc_orientation.py \
            --groundtruth data/euroc/MH_01_easy/mav0/state_groundtruth_estimate0/data.csv \
            --baseline-trajectory results/real_euroc/MH_01_easy/imu_only/trajectory.csv \
            --visual-trajectory results/real_euroc/MH_01_easy/opencv_rotation/trajectory.csv \
            --output results/real_euroc/MH_01_easy/attitude_alignment_diagnostic.json
          cat results/real_euroc/MH_01_easy/attitude_alignment_diagnostic.json

      - name: Run public-data failure-prediction vertical slice
        run: |
          python scripts/run_paper_vertical_slice.py \
            --run-dir results/real_euroc/MH_01_easy/opencv_rotation \
            --sequence-root data/euroc/MH_01_easy \
            --output results/real_euroc/MH_01_easy/paper_vertical_slice \
            --config configs/paper/vertical_slice_smoke.yaml \
            --seed 7

      - name: Validate publication smoke evidence gate
        run: |
          python scripts/validate_public_smoke.py \
            results/real_euroc/MH_01_easy/paper_vertical_slice \
            --expected-dataset EuRoC_MAV \
            --expected-sequence MH_01_easy \
            --report results/real_euroc/MH_01_easy/paper_vertical_slice/smoke_validation.json
          cat results/real_euroc/MH_01_easy/paper_vertical_slice/smoke_validation.json

      - name: Upload real benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shield-vio-real-euroc-mh01-paired
          path: results/real_euroc/MH_01_easy
          if-no-files-found: error
          retention-days: 30
